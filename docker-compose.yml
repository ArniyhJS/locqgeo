services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: locqgeo-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: locqgeo
      POSTGRES_PASSWORD: locqgeopass
      POSTGRES_DB: locqgeo_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locqgeo -d locqgeo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: locqgeo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
