packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.8'
  - '@turbo/darwin-arm64@2.10.8'
  - '@turbo/linux-64@2.10.8'
  - '@turbo/linux-arm64@2.10.8'
  - '@turbo/windows-64@2.10.8'
  - '@turbo/windows-arm64@2.10.8'
  - turbo@2.10.8

overrides:
  typescript: 5.9.3
  next: 16.2.12
  "@next/eslint-plugin-next": 16.2.12
  eslint-config-next: 16.2.12
  react: 19.2.8
  react-dom: 19.2.8
  zod: 4.4.3
  vitest: 4.1.10
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  tailwindcss: 4.3.3
  "@types/node": 26.1.1
  vite: 8.1.5
