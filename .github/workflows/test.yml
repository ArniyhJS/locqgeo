name: Unified Monorepo CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Lint, and Test Workspaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        run: pnpm run check-types

      - name: Run Lint
        run: pnpm run lint

      - name: Run Turborepo Build
        run: pnpm run build
